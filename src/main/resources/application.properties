spring.application.name=intern-backend
server.port=${PORT:8080}

# Relax Tomcat header restrictions (Prevents HTTP 400 Bad Request)
server.max-http-header-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=false

# Database credentials (quoted so // and $ are treated as literal strings)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/intern_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password="${SPRING_DATASOURCE_PASSWORD:M@njul$123//}"

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Prevents local crash if local database isn't reachable
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false